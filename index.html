<!DOCTYPE html>
<html lang="fr">

<title>Se lever de la chaise</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1d1b18; --muted: #5f5a52; --line: #e3ddd3;

  * { box-sizing: border-box; }

  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .page {
    max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  h1 { font-size: clamp(34px, 7.5vw, 54px); line-height: 1.1; margin: 8px 0 0; }
  .lead { font-size: clamp(20px, 4.4vw, 26px); color: var(--muted); margin: 0; }
  .langs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .lang { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-size: 18px; cursor: pointer; }
  .lang[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .steps { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 12px; width: 100%; text-align: left; }
  .steps li { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; font-size: clamp(19px, 4vw, 23px); }
  .steps .n { flex: 0 0 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; margin-top: 1px; }
  .big { width: 100%; max-width: 460px; min-height: 80px; border: 0; border-radius: 22px; background: var(--accent); color: #fff; font-size: clamp(26px, 5.5vw, 32px); font-weight: 700; cursor: pointer; }
  .big:active { transform: scale(.98); }
  .note { font-size: 17px; color: var(--muted); margin: 0; }
  .error { color: #b3261e; font-size: 19px; margin: 0; }

  details.team { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 16px; }
  details.team summary { cursor: pointer; color: var(--muted); font-size: 16px; }
  details.team label { display: block; color: var(--muted); margin: 10px 0 4px; font-size: 15px; }
  details.team input, details.team select, details.team textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 17px; }
  details.team .check { display: flex; gap: 10px; align-items: center; }
  details.team .check input { width: 22px; height: 22px; }
  details.team .row { display: flex; gap: 10px; } details.team .row > * { flex: 1; min-width: 0; }
  details.team button { margin-top: 12px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: #f1ede6; font-size: 16px; font-weight: 650; cursor: pointer; }
  details.team .facts { margin: 8px 0 0; color: var(--ink); font-size: 15px; line-height: 1.6; }
  details.team a { color: var(--accent); }

  /* camera screen */
  #camera { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #camera video, #camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .mirror { transform: scaleX(-1); }
  #msg {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; background: rgba(0,0,0,.66); color: #fff; text-align: center;
    padding: max(18px, env(safe-area-inset-top)) 20px 18px; font-size: clamp(24px, 5.6vw, 42px); font-weight: 650; line-height: 1.25;
  }
  #msg.ok { background: rgba(26,127,75,.85); }
  #count { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: min(40vh, 44vw); text-shadow: 0 4px 32px rgba(0,0,0,.7); pointer-events: none; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 20px max(18px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #stopBtn { min-height: 64px; padding: 0 26px; border: 0; border-radius: 18px; background: rgba(255,255,255,.94); color: #1d1b18; font-size: 22px; font-weight: 700; cursor: pointer; }
  #timeLeft { color: #fff; font-size: clamp(26px, 6vw, 44px); font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; z-index: 3; background: rgba(255,255,255,.18); }
  #barFill { height: 100%; width: 0; background: #34c759; transition: width .2s linear; }
  #debug { position: absolute; right: 8px; top: 50%; z-index: 3; color: #fff; font: 13px/1.3 ui-monospace, monospace; background: rgba(0,0,0,.5); padding: 4px 6px; border-radius: 6px; }

  /* result screen */
  .resultNumber { font-size: clamp(110px, 30vw, 180px); font-weight: 800; line-height: 1; color: var(--accent); margin-top: 8px; }
  .card { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; text-align: left; }
  .card .label { color: var(--muted); font-size: 18px; margin: 0 0 6px; }
  .card .ex { font-size: clamp(22px, 4.8vw, 28px); font-weight: 650; margin: 0; }
  .tip { background: #fff6e6; border: 1px solid #f2d9a8; color: #6b4300; border-radius: 16px; padding: 12px 16px; font-size: 19px; width: 100%; text-align: left; margin: 0; }

  /* team sheet: how the app decides */
  .how { text-align: left; align-items: stretch; gap: 12px; }
  .how h2 { font-size: clamp(28px, 6vw, 38px); line-height: 1.15; margin: 4px 0 0; }
  .how h3 { font-size: 20px; margin: 16px 0 0; }
  .how p, .how li { font-size: 17px; margin: 0; }
  .how .howNote { color: var(--muted); }
  .how ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .how a { color: var(--accent); }
  #howBody { display: flex; flex-direction: column; gap: 10px; }
  .back { align-self: flex-start; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 17px; cursor: pointer; }
  .outcomes { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }

  .outcome .badge { flex: 0 0 68px; height: 48px; border-radius: 12px; background: #e9f0fd; color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 21px; }
  .outcome.muted .badge { background: #f1ede6; color: var(--muted); }
  .outcome .oTitle { font-weight: 700; font-size: 18px; }
  .outcome .oWhen { color: var(--muted); font-size: 16px; }
  .outcome .oShows { font-size: 16px; margin-top: 4px; }
  .refTable { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: 16px; }
  .refTable th, .refTable td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; }

</head>
<body>

<!-- 1. Start -->
<section id="start" class="page">
  <div class="langs" role="group" aria-label="Langue / Language">
    <button class="lang" data-lang="fr">Français</button>
    <button class="lang" data-lang="de">Deutsch</button>
    <button class="lang" data-lang="it">Italiano</button>
    <button class="lang" data-lang="en">English</button>
    <button class="lang" data-lang="es">Español</button>
  </div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="subtitle"></p>
  <ol class="steps">
    <li><span class="n">1</span><span data-t="step1"></span></li>
    <li><span class="n">2</span><span data-t="step2"></span></li>
    <li><span class="n">3</span><span data-t="step3"></span></li>
  </ol>
  <button id="startBtn" class="big" data-t="start"></button>
  <p id="startError" class="error" hidden></p>
  <p class="note" data-t="privacy"></p>

  <details class="team">
    <summary>For the team</summary>
    <div class="row">
      <div><label for="age">Age band</label><select id="age"></select></div>
      <div><label for="sex">Sex</label><select id="sex"><option value="F">F</option><option value="M">M</option></select></div>
      <div><label for="cam">Camera</label><select id="cam"><option value="user">Front</option><option value="environment">Back</option></select></div>
    </div>
    <button id="howBtn" type="button">How the app decides</button>
    <p class="facts" id="sessionsInfo"></p>
    <button id="exportBtn" type="button">Export results (CSV)</button>
    <p class="facts">Full nurse version (3 tests and report): <a href="./nurse.html">nurse.html</a></p>
  </details>
</section>

<!-- 2. Camera -->
<section id="camera" hidden>
  <video id="video" class="mirror" playsinline muted autoplay></video>
  <canvas id="overlay" class="mirror"></canvas>
  <div id="msg"></div>
  <div id="count"></div>
  <div id="bottom">
    <button id="stopBtn" data-t="stop"></button>
    <div id="timeLeft"></div>
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="debug" hidden></div>
</section>

<!-- 3. Result -->
<section id="result" class="page" hidden>
  <div id="resNumber" class="resultNumber"></div>
  <h1 id="resTitle"></h1>
  <p id="resBravo" class="lead"></p>
  <div id="resExercise" class="card">
    <p class="label" data-t="nextTitle"></p>
    <p class="ex" id="resNext"></p>
  </div>
  <p id="resTip" class="tip" hidden></p>
  <button id="againBtn" class="big" data-t="again"></button>

  <details class="team" id="teamNotes">
    <summary>Team notes</summary>
    <p class="facts" id="resFacts"></p>
    <button id="howBtn2" type="button">How the app decides</button>
    <div class="row">
      <div><label for="handCount">Hand count</label><input id="handCount" type="number" min="0" max="60" inputmode="numeric" /></div>
      <div><label class="check" style="margin-top:34px"><input id="neededHelp" type="checkbox" /> Needed help to place the phone</label></div>
    </div>
    <label for="notes">Notes</label>
    <textarea id="notes" rows="2" placeholder="Quotes, problems, ideas"></textarea>
    <button id="saveBtn" type="button">Save</button>
    <span id="saveMsg" class="facts"></span>
  </details>
</section>

<!-- 4. Team sheet: possible results and how the app decides (English, never shown to participants) -->
<section id="how" class="page how" lang="en" hidden>
  <button class="back" type="button">‹ Back</button>
  <h2>How the app decides</h2>
  <p class="howNote">For the team. Participants never see this page.</p>
  <div id="howBody"></div>
  <button class="back" type="button">‹ Back</button>
</section>

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
};

const app = {
  lang: 'fr', mp: null, landmarker: null, delegate: null, stream: null, running: false,
  phase: 'idle', // idle | loading | waiting | countdown | running | done
  smoother: new L.FeatureSmoother(), gate: new L.FramingGate(),
  feat: null, framingOk: false, framingReason: 'no_person',
  seatedSince: null, lostSince: null, runner: null, lastCount: 0, tenSaid: false,
  startTapAt: 0, setupS: null, result: null, saved: false,
  lastTs: -1, lastVideoTime: -1, timers: [], wakeLock: null, spoken: { key: null, at: 0 },
  perf: { frames: 0, poseFrames: 0, fps: 0, lastTs: null },
};
window.__app = app; // for debugging and automated tests

const t = (key) => T[app.lang][key];

// ------------------------------------------------------------ language
function setLang(lang) {
  app.lang = T[lang] ? lang : 'fr';
  store.set('sit-to-stand-lang', app.lang);
  document.documentElement.lang = app.lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('.lang').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === app.lang)));
}

function initialLang() {
  const saved = store.get('sit-to-stand-lang', null);
  if (saved && T[saved]) return saved;
  const nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  return T[nav] ? nav : 'fr';
}

// ------------------------------------------------------------ voice
function speak(text, onEnd) {
  let finished = false;
  const done = () => { if (!finished) { finished = true; onEnd?.(); } };
  try {
    if (!text || !('speechSynthesis' in window)) { if (onEnd) setTimeout(done, 1200); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE[app.lang];
    u.rate = 0.92;
    u.onend = done;
    u.onerror = done;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
    if (onEnd) setTimeout(done, 800 + text.length * 85); // in case onend never fires
  } catch {
    if (onEnd) setTimeout(done, 1200);
  }
}

// Say a guidance message once, and repeat it at most every 7 s while it stays the same.
function guide(key, text = t(key), cls = '') {
  $('msg').textContent = text;
  $('msg').className = cls;
  const now = performance.now();
  if (app.spoken.key !== key || now - app.spoken.at > 7000) {
    app.spoken = { key, at: now };
    speak(text);
  }
}

const later = (fn, ms) => { app.timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { app.timers.forEach(clearTimeout); app.timers = []; };

// ------------------------------------------------------------ screens
function show(id) {
  for (const s of ['start', 'camera', 'result', 'how']) $(s).hidden = s !== id;
  window.scrollTo(0, 0);
}

// ------------------------------------------------------------ model and camera
async function loadModel() {
  if (app.landmarker) return;
  if (!app.mp) app.mp = await import(LIB_URL);
  const { FilesetResolver, PoseLandmarker } = app.mp;
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const options = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: 'VIDEO', numPoses: 1,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  let delegate = FORCE_CPU ? 'CPU' : 'GPU';
  try {
    app.landmarker = await PoseLandmarker.createFromOptions(fileset, options(delegate));
  } catch (err) {
    if (delegate !== 'GPU') throw err;
    delegate = 'CPU';
    app.landmarker = await PoseLandmarker.createFromOptions(fileset, options(delegate));
  }
  app.delegate = delegate;
}

async function start() {
  speak(t('loading')); // first words inside the tap: unlocks speech on iPhone
  $('startError').hidden = true;
  app.startTapAt = performance.now();
  Object.assign(app, { phase: 'loading', result: null, saved: false, setupS: null, seatedSince: null, lostSince: null, runner: null, lastCount: 0, tenSaid: false, spoken: { key: null, at: 0 } });
  $('count').textContent = '';
  $('timeLeft').textContent = '';
  $('barFill').style.width = '0';
  $('msg').className = '';
  $('msg').textContent = t('loading');
  show('camera');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('This page needs https:// for the camera.');
    await loadModel();
    const facing = $('cam').value;
    app.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    video.srcObject = app.stream;
    await video.play();
    video.classList.toggle('mirror', facing === 'user');
    canvas.classList.toggle('mirror', facing === 'user');
    try { app.wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    app.smoother.reset();
    app.gate.reset();
    app.lastVideoTime = -1;
    app.perf = { frames: 0, poseFrames: 0, fps: 0, lastTs: null };
    app.running = true;
    app.phase = 'waiting';
    scheduleNext();
  } catch (e) {
    console.error(e);
    stopCamera();
    show('start');
    $('startError').textContent = `${t('cameraError')} (${e.name || 'Error'})`;
    $('startError').hidden = false;
  }
}

function stopCamera() {
  app.running = false;
  clearTimers();
  if (app.stream) app.stream.getTracks().forEach((tr) => tr.stop());
  app.stream = null;
  video.srcObject = null;
  try { app.wakeLock?.release(); } catch {}
  app.wakeLock = null;
}

function cancel() {
  try { speechSynthesis.cancel(); } catch {}
  stopCamera();
  app.phase = 'idle';
  show('start');
}

const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function scheduleNext() {
  if (!app.running) return;
  if (hasRVFC) video.requestVideoFrameCallback((now, meta) => onFrame(meta));
  else requestAnimationFrame(() => onFrame(null));
}

function onFrame(meta) {
  if (!app.running) return;
  try { processFrame(meta); } catch (e) { console.error(e); }
  scheduleNext();
}

// ------------------------------------------------------------ every frame
function processFrame(meta) {
  if (!app.landmarker || video.readyState < 2 || !video.videoWidth) return;
  if (!meta && video.currentTime === app.lastVideoTime) return;
  app.lastVideoTime = video.currentTime;
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  let ts = performance.now();
  if (ts <= app.lastTs) ts = app.lastTs + 1;
  app.lastTs = ts;

  const res = app.landmarker.detectForVideo(video, ts);
  const lm = res?.landmarks?.[0] ?? null;
  const wlm = res?.worldLandmarks?.[0] ?? null;
  const raw = lm ? L.extractFeatures(lm, wlm, video.videoWidth / video.videoHeight) : { ok: false, visibility: 0 };
  const feat = app.smoother.smooth(raw, ts);
  const framing = L.framingCheck(lm);
  app.framingOk = app.gate.update(framing.ok, ts);
  app.framingReason = framing.reason;
  app.feat = feat;

  const p = app.perf;
  p.frames++;
  if (lm) p.poseFrames++;
  if (p.lastTs !== null) p.fps = p.fps ? p.fps * 0.9 + (1000 / Math.max(1, ts - p.lastTs)) * 0.1 : 1000 / Math.max(1, ts - p.lastTs);
  p.lastTs = ts;
  if (DEBUG) {
    $('debug').hidden = false;
    $('debug').textContent = `${Math.round(p.fps)} fps · ${app.delegate}\nknee ${feat?.kneeAngle ? Math.round(feat.kneeAngle) : '–'}° · ${framing.reason}`;
  }

  draw(lm);
  step(feat, framing, ts);
}

function draw(lm) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lm || !app.mp) return;
  const W = canvas.width, H = canvas.height;
  ctx.lineWidth = Math.max(3, W / 260);
  ctx.lineCap = 'round';
  ctx.strokeStyle = app.framingOk ? 'rgba(52,199,89,.85)' : 'rgba(255,255,255,.6)';
  for (const { start, end } of app.mp.PoseLandmarker.POSE_CONNECTIONS) {
    const a = lm[start], b = lm[end];
    if (start < 11 || end < 11) continue; // skip the face
    if ((a.visibility ?? 1) < 0.4 || (b.visibility ?? 1) < 0.4) continue;
    ctx.beginPath();
    ctx.moveTo(a.x * W, a.y * H);
    ctx.lineTo(b.x * W, b.y * H);
    ctx.stroke();
  }
}

// ------------------------------------------------------------ the flow
function step(feat, framing, now) {
  const c = L.CONFIG.chairStand;

  if (app.phase === 'waiting') {
    if (!framing.ok) {
      app.seatedSince = null;
      guide(framing.reason);
      return;
    }
    const seated = feat?.ok && feat.kneeAngle <= c.sitBelowDeg;
    if (!seated || !app.framingOk) {
      app.seatedSince = null;
      guide('sitDown', t('sitDown'), 'ok');
      return;
    }
    if (app.seatedSince === null) app.seatedSince = now;
    if (now - app.seatedSince >= SEATED_HOLD_MS) startCountdown();
    return;
  }

  if (app.phase === 'countdown') {
    // Person left the picture for more than 1.5 s: wait again.
    if (!feat?.ok) {
      if (app.lostSince === null) app.lostSince = now;
      if (now - app.lostSince > 1500) {
        clearTimers();
        $('count').textContent = '';
        app.phase = 'waiting';
        app.seatedSince = null;
      }
    } else {
      app.lostSince = null;
    }
    return;
  }

  if (app.phase === 'running') {
    const r = app.runner.update(feat, now);
    const elapsed = (now - app.runner.t0) / 1000;
    const left = Math.max(0, 30 - elapsed);
    if (app.runner.count !== app.lastCount) {
      app.lastCount = app.runner.count;
      speak(String(app.runner.count));
    }
    if (!app.tenSaid && left <= 10) {
      app.tenSaid = true;
      later(() => speak(t('tenLeft')), 700);
    }
    $('count').textContent = String(app.runner.count);
    $('timeLeft').textContent = `${Math.ceil(left)} s`;
    $('barFill').style.width = `${Math.min(100, (elapsed / 30) * 100)}%`;
    if (r) finish(r);
  }
}

function startCountdown() {
  app.phase = 'countdown';
  app.lostSince = null;
  app.setupS = Math.round((performance.now() - app.startTapAt) / 1000);
  $('msg').className = 'ok';
  $('msg').textContent = t('ready');
  speak(t('ready'), () => {
    let n = 3;
    const tick = () => {
      if (app.phase !== 'countdown') return;
      if (n > 0) {
        $('count').textContent = String(n);
        speak(String(n));
        n--;
        later(tick, 1000);
      } else {
        $('count').textContent = '0';
        $('msg').textContent = t('go');
        speak(t('go'));
        beginTest();
      }
    };
    later(tick, 400);
  });
}

function beginTest() {
  app.runner = new L.ChairStandTest();
  app.runner.start(performance.now());
  app.lastCount = 0;
  app.tenSaid = false;
  app.phase = 'running';
  later(() => { if (app.phase === 'running') $('msg').textContent = t('keepGoing'); }, 2000);
}

function finish(result) {
  app.phase = 'done';
  app.result = result;
  $('timeLeft').textContent = '0 s';
  $('barFill').style.width = '100%';
  $('msg').textContent = t('stopNow');
  speak(t('stopNow'));
  later(() => {
    stopCamera();
    showResult();
  }, 1800);
}

function showResult() {
  const r = app.result;
  const ok = r.reliable;
  $('resNumber').textContent = ok ? String(r.stands) : '?';
  $('resTitle').textContent = ok ? t('resultTitle')(r.stands) : t('notSeen');
  $('resBravo').textContent = ok ? t('bravo') : t('notSeenSub');
  $('resExercise').hidden = !ok;
  $('resTip').hidden = !(ok && r.armsUsedSuspected);
  $('resTip').textContent = t('armsTip');
  if (ok) {
    const level = levelFor(r);
    $('resNext').textContent = t('levels')[level - 1];
  }
  $('handCount').value = '';
  $('neededHelp').checked = false;
  $('notes').value = '';
  $('saveMsg').textContent = '';
  $('teamNotes').open = false;
  $('resFacts').innerHTML = factsHtml(r);
  show('result');
  speak(ok ? `${t('resultTitle')(r.stands)}. ${t('bravo')}` : t('notSeen'));
}

function levelFor(r) {
  return L.targetLevels({ chair: r, ageBand: $('age').value, sex: $('sex').value }).sit_to_stand ?? 1;
}

// ------------------------------------------------------------ team notes
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

const sexWord = (s) => (s === 'M' ? 'man' : 'woman');
const standsWord = (n) => `${n} stand${n === 1 ? '' : 's'}`;

// The level the app shows and why, in words for the team (same rule as L.targetLevels).
function decision(r) {
  const age = $('age').value;
  const sex = $('sex').value;
  const ref = L.chairStandReference(age, sex);
  const who = `${age}, ${sexWord(sex)}`;
  if (!r.reliable) {
    const min = Math.round(L.CONFIG.quality.minGoodFrameRatio * 100);
    return { level: null, because: `tracking was ${Math.round((r.quality ?? 0) * 100)}%, under ${min}%` };
  }
  const level = levelFor(r);
  if (level === 1) return { level, because: '0 stands were counted' };
  if (ref === null) return { level, because: `there is no CDC reference for ${who}` };
  const side = level === 2 ? 'under' : 'at or above';
  return { level, because: `${standsWord(r.stands)} is ${side} the CDC reference of ${ref} (${who})` };
}

function factsHtml(r) {
  const d = decision(r);
  const parts = [
    `App count: <b>${r.stands}</b>${r.partialStandCounted ? ' (last one counted at halfway)' : ''}`,
    `Suggested: <b>${d.level ? `level ${d.level}` : 'no level'}</b>, because ${esc(d.because)}`,
    `Tracking quality: ${Math.round((r.quality ?? 0) * 100)}%${r.reliable ? '' : ' (too low: no count shown)'}`,
    `Setup time: ${app.setupS ?? '–'} s`,
    `Wrists left the chest: ${r.armsUsedSuspected ? 'yes' : 'no'}`,
    `Max trunk lean: ${r.maxTrunkLeanDeg ?? '–'}°`,
  ];
  return parts.join('<br>');
}

function saveSession() {
  const r = app.result;
  if (!r) return;
  const hand = $('handCount').value === '' ? null : Number($('handCount').value);
  const now = new Date();
  const rows = store.get(STORE_KEY, []);
  const row = {
    date: now.toISOString().slice(0, 10),
    time: now.toTimeString().slice(0, 5),
    language: app.lang,
    age_band: $('age').value,
    sex: $('sex').value,
    app_count: r.reliable ? r.stands : null,
    hand_count: hand,
    difference: r.reliable && hand !== null ? r.stands - hand : null,
    needed_help: $('neededHelp').checked,
    setup_s: app.setupS,
    quality: r.quality,
    reliable: r.reliable,
    wrists_left_chest: r.armsUsedSuspected,
    suggested_level: r.reliable ? levelFor(r) : null,
    notes: $('notes').value.trim(),
  };
  if (app.saved) rows[rows.length - 1] = row; else rows.push(row);
  const okSaved = store.set(STORE_KEY, rows);
  app.saved = okSaved;
  $('saveMsg').textContent = okSaved ? ` Saved (${rows.length} in total)` : ' Could not save on this browser';
  updateSessionsInfo();
}

function updateSessionsInfo() {
  const n = store.get(STORE_KEY, []).length;
  $('sessionsInfo').textContent = `${n} session${n === 1 ? '' : 's'} saved on this phone.`;
}

// ------------------------------------------------------------ team sheet
// Built from the code's own numbers (CONFIG, CDC table, level wording), so it cannot drift from what the app does.
function renderHow() {
  const age = $('age').value;
  const sex = $('sex').value;
  const ref = L.chairStandReference(age, sex) ?? 0;
  const C = L.CONFIG;
  const en = T.en;
  const min = Math.round(C.quality.minGoodFrameRatio * 100);
  const q = (s) => `“${esc(s)}”`;
  const below = ref - 1 <= 1 ? { badge: '1', words: '1 stand' } : { badge: `1-${ref - 1}`, words: `1 to ${ref - 1} stands` };
  const outcome = (badge, title, when, shows, muted = false) =>
    `<li class="outcome${muted ? ' muted' : ''}"><div class="badge">${badge}</div><div>` +
    `<p class="oTitle">${title}</p><p class="oWhen">${when}</p><p class="oShows">${shows}</p></div></li>`;
  const rows = L.AGE_BANDS.map((band) => {
    const row = L.CHAIR_STAND_BELOW_AVERAGE[band];
    const cell = (s) => `<td${band === age && s === sex ? ' class="cur"' : ''}>${row[s]}+</td>`;
    return `<tr><th scope="row">${band}</th>${cell('M')}${cell('F')}</tr>`;
  }).join('');

  $('howBody').innerHTML = `
    <h3>One test, one number</h3>
    <p>The person does the 30-second chair stand, arms crossed on the chest. The app counts a stand each time the knee straightens past ${C.chairStand.standAboveDeg}°. At 30 s, a stand more than halfway up also counts (CDC rule).</p>

    <h3>Possible results</h3>
    <p class="howNote">Current settings: <b>${esc(age)}, ${sexWord(sex)}</b>, so the CDC reference is <b>${ref} stands</b>. Change them under <i>For the team</i> on the start screen.</p>
    <p class="howNote">The app goes down this list and stops at the first case that fits:</p>
    <ol class="outcomes">
      ${outcome('?', 'No count', `Fewer than ${min}% of the video frames were usable.`, `Screen: ${q(en.notSeen)} No exercise. Check the phone position and the light, then tap ${q(en.again)}.`, true)}
      ${outcome('0', 'Level 1', '0 stands counted.', q(en.levels[0]))}
      ${outcome(below.badge, 'Level 2', `${below.words}: under the reference.`, q(en.levels[1]))}
      ${outcome(`${ref}+`, 'Level 3', `${ref} stands or more: at or above the reference.`, q(en.levels[2]))}
    </ol>
    <p class="howNote">Every level comes with “3 times a week”. Level 4 (without hands, 2 sets of 10) exists but is never proposed.</p>
    <p class="howNote">If the wrists leave the chest, the result adds ${q(en.armsTip)} The level does not change.</p>

    <h3>CDC reference by age and sex</h3>
    <table class="refTable">
      <thead><tr><th scope="col">Age</th><th scope="col">Men</th><th scope="col">Women</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="howNote">Stands in 30 seconds. Fewer is below average for that age and sex, which the CDC links to a risk of falls. The current setting is highlighted.</p>

    <h3>Keep in mind</h3>
    <ul>
      <li>This is a first rule for the user test. No nurse or physiotherapist has checked it yet.</li>
      <li>Pushing up with the hands does not lower the level.</li>
      <li>Just under the reference (${standsWord(Math.max(ref - 1, 1))} for the current settings) gives level 2, which is easier than what the person just did.</li>
      <li>Set age band and sex before each person. Default: 75-79, woman.</li>
    </ul>

    <h3>Sources</h3>
    <ul>
      <li><a href="https://stacks.cdc.gov/view/cdc/157303/cdc_157303_DS1.pdf" target="_blank" rel="noopener">CDC STEADI: 30-second chair stand</a></li>
      <li><a href="https://www.med.unc.edu/aging/cgwep/wp-content/uploads/sites/865/2024/04/Otago-Guide-for-PT_April-2024-update.pdf" target="_blank" rel="noopener">Otago Exercise Program: sit-to-stand levels A, B, C</a></li>
    </ul>`;
}

function openHow(from) {
  app.howFrom = from;
  renderHow();
  show('how');
}

function closeHow() {
  if (location.hash === '#how') history.replaceState(null, '', location.pathname + location.search);
  show(app.howFrom || 'start');
}

function exportCsv() {
  const rows = store.get(STORE_KEY, []);
  if (!rows.length) { $('sessionsInfo').textContent = 'No session saved yet.'; return; }
  const cols = Object.keys(rows[0]);
  const cell = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `sit-to-stand-tests_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ------------------------------------------------------------ wiring
for (const band of L.AGE_BANDS) $('age').add(new Option(band, band, band === '75-79', band === '75-79'));
document.querySelectorAll('.lang').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('startBtn').addEventListener('click', start);
$('stopBtn').addEventListener('click', cancel);
$('againBtn').addEventListener('click', start);
$('saveBtn').addEventListener('click', saveSession);
$('exportBtn').addEventListener('click', exportCsv);
$('howBtn').addEventListener('click', () => openHow('start'));
$('howBtn2').addEventListener('click', () => openHow('result'));
document.querySelectorAll('#how .back').forEach((b) => b.addEventListener('click', closeHow));
setLang(initialLang());
updateSessionsInfo();
if (location.hash === '#how') openHow('start'); // direct link for the team: .../#how

// Test hook: skip waiting for a seated person (used by tools/ scripts).
app.forceCountdown = () => { if (app.phase === 'waiting') startCountdown(); };
</script>
